、强迫或监控不应被解释成偏好差异；可以停止共同练习，以个人安全与自愿为先。</p></section>`;

  function renderMethod() {
    return `<section class="page-shell narrow method-content"><div class="page-top"><div><div class="eyebrow">READ THE SMALL PRINT</div><h1 tabindex="-1">一本说明书，不是一种定论。</h1><p>24 题探索性精简原型 · 1.4.0</p></div><button class="back-button" data-action="home">← 首页</button></div><div class="paper-panel"><h2 style="margin-top:0">先选封面，再写具体需要</h2><p>封面是自选的视觉人设，可以认领一句喜欢的话。它不进入计分，不影响题目顺序，也不能制造人格结论。答完仍可更换；没有合适的角色，也可以不贴标签。</p><h2>为什么变成 24 题</h2><p>本版根据试用反馈，从原 48 道候选题中逐项筛选并简写，每个独立偏好分面保留 2 题，尽量覆盖不同日常情境、减少近义重复。不是随机减半，也不是经过心理测量验证的“有效短版”。原稿本来就没有产品信度、效度、常模或预测证据，精简后更不能声称继承这些证据。</p><p>仍保留 6 个领域和 12 个独立观察点。它们是否能在研究中区分、是否需要合并，仍待检验。约 4–6 分钟只是估计，不是实测耗时。</p><h2>怎么回答与计分</h2><p>回想过去一个月，回答本人希望怎样相处，不评价伴侣表现，也不替对方答题。每章 4 题，两个分面交错出现。所有题正向计分。</p><table class="method-table"><thead><tr><th>选择</th><th>含义</th></tr></thead><tbody>${labels.map((l,i)=>`<tr><td>${i+1}</td><td>${l}</td></tr>`).join('')}<tr><td>NA</td><td>不适用、无经历、无法判断或不愿回答；不记为 3，也不进分母</td></tr></tbody></table><p><strong>本版每个分面必须 2/2 题有效</strong>，才显示两题的算术平均数及暂定倾向。任一题 NA 或缺失，就显示“信息不足”，不补分、不推荐该项角色。旧版“至少 3/4”规则不适用于本版。</p><table class="method-table"><thead><tr><th>两题均分</th><th>暂定描述</th></tr></thead><tbody><tr><td>≥ 4</td><td>较明确符合</td></tr><tr><td>≤ 2</td><td>较少符合</td></tr><tr><td>&gt; 2 且 &lt; 4</td><td>中间／情境混合</td></tr></tbody></table><p>2/2、这些阈值与角色推荐都是未验证的内容规则，不是临床界值、统计显著性或常模。每项独立呈现，没有总分；两种需要同时高不矛盾，同时低也不能说明关系差。小数差异不被解释成稳定心理差异。</p><h2>角色和关键偏好</h2><p>封面由你选择。答题后，只有 2/2 有效且均分 ≥ 4 的分面才可作为暂定共鸣提示；多个候选并列，不排名心理强度，不强推唯一角色。没有满足条件的分面时不强贴标签。自由更换封面不会改变 12 项结果。</p><h2>同设备双人与分享</h2><p>第一位独立完成、看个人结果并决定是否同意对照，再交接设备。第二位独立选择封面和答题、看自己的结果，再决定是否同意。第二位首次填写不会撤销第一位已经给出的同意；任一位修改完成后的答案，会撤回其对修改版结果的同意，需要本人重新确认，另一位不被重复索要同意。任何人都可以撤回或只保留个人结果。</p><p>PNG 默认匿名，聚焦自选封面、最多两项暂定关键偏好和一句自选个人使用说明，不显示原始题目答案或另一方资料。双人导出每次另需两人分别同意；改变预览后重新确认。保存图片不会替你发送，清除数据也不能删除已下载的图片。</p><h2>旧版 48 题记录怎么处理</h2><p>24 题使用新的版本标识、题目 ID 与独立存储键，不读取旧答案来计分。发现同一浏览器的旧记录时会提示，原记录原样保留，可导出 JSON 存档，也可以在明确确认后单独删除。重做或清除新版不会静默删除旧版。源码包附带原 48 题 HTML，可用它在原来的本机环境继续查看原版；本版本不会自动转换旧结果。</p><h2>本机数据与适用范围</h2><p>没有账号、支付、后台答题收集、外部 AI、远程字体或跟踪脚本。不读取私人聊天。答案、封面、使用说明与进度只存在当前浏览器，换设备不能同步，共享设备没有密码隔离。file:// 存储受浏览器设置影响，无法保存时会提示。</p><p>本工具面向能够安全、自愿表达的成年人。威胁、羞辱、暴力、强迫或监控不是需要折中的偏好差异。可以停止共同练习，以安全和自愿为先。</p><h2>原题保留与简写映射</h2><p>每个分面保留的原题编号如下。简写不是量表验证；选择理由及原句、新句完整收录在源码包的映射文件。</p><table class="method-table"><thead><tr><th>分面</th><th>保留原题</th></tr></thead><tbody>${facets.map(f=>`<tr><td>${f.title}</td><td>${f.questions.map(q=>q.sourceId.split('_').at(-1)).join('、')}</td></tr>`).join('')}</tbody></table><h2>理论来源与能支持的范围</h2><p>以下 9 项来源仅提供理论、原始研究或测量开发方法的启发，都没有验证原 48 题或本版 24 题。原量表信效度不能迁移，关联研究不能证明因果。</p>${C.sources.map(x=>`<article class="source"><h3>${esc(x.authors)}<br>${esc(x.title)}</h3><p><strong>提供的启发：</strong>${esc(x.supports)}</p><p><strong>不能据此声称：</strong>${esc(x.limits)}</p><a href="${x.url}" target="_blank" rel="noopener noreferrer">${x.url} ↗</a></article>`).join('')}<h2>仍待研究</h2><p>内容评审、认知访谈、可用性试验、独立结构探索与验证、可靠性、重测和公平性等均尚未完成。功能测试不等于心理测量验证，也不提供任何匹配百分比、关系排名或命定判断。</p><button class="button outline small" data-action="home">回到首页 ←</button></div></section>`;
  }

      if(include&&p.alias){ctx.fillStyle='#27645b';ctx.font='20px "Microsoft YaHei",sans-serif';canvasText(ctx,p.alias+' 的使用说明',540,1170,730,30,1);}
    }else{
      people.forEach((p,i)=>{const x=i?565:90,r=p.role!==null?C.roles[p.role]:null;round(ctx,x,410,425,580,24,i?'#f1d8c9':'#e5ecdd','#d3d9cc');if(images[i])ctx.drawImage(images[i],x+58,438,310,310);ctx.textAlign='center';ctx.fillStyle='#233d36';ctx.font='600 32px "Microsoft YaHei",sans-serif';ctx.fillText(r?r.name:'暂时不贴标签',x+212,810);ctx.fillStyle='#53675a';ctx.font='22px "Microsoft YaHei",sans-serif';canvasText(ctx,r?r.tagline:'需要可以并存，也可以改变。',x+212,865,345,36,2);if(include&&p.alias){ctx.font='18px "Microsoft YaHei",sans-serif';canvasText(ctx,p.alias,x+212,956,330,28,1);}});
      ctx.textAlign='center';ctx.fillStyle='#27645b';ctx.font='20px "Microsoft YaHei",sans-serif';ctx.fillText('我们想附上的一句说明',540,1050);ctx.fillStyle='#233d36';ctx.font='28px "Microsoft YaHei",sans-serif';canvasText(ctx,copy||model.exportLine,540,1115,850,44,3);
    }
    ctx.textAlign='left';ctx.strokeStyle='#cbd2c3';ctx.beginPath();ctx.moveTo(90,1265);ctx.lineTo(990,1265);ctx.stroke();ctx.fillStyle='#66736a';ctx.font='20px "Microsoft YaHei",sans-serif';ctx.fillText('原创探索小测 · 不做匹配排名 · 不判断关系好坏',90,1315);ctx.font='17px sans-serif';ctx.fillText('FACTORY SETTINGS FOR TWO  /  1.4.0',90,1355);
    button.disabled=false;button.textContent='下载 PNG ↓';document.querySelector('#share-error').textContent='';
  }
  async function download() {
    if(shareKind==='pair'&&!(document.querySelector('#share-consent-a').checked&&document.querySelector('#share-consent-b').checked)) {document.querySelector('#share-error').textContent='请两位分别确认当前预览；任何一位不同意都可以关闭。';return;}
    const button=document.querySelector('#download-button');if(button.disabled)return;button.disabled=true;button.textContent='正在生成…';
    try {
      const canvas=document.querySelector('#share-canvas');
      const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
      if(!blob)throw new Error('no blob');
      if(shareUrl)URL.revokeObjectURL(shareUrl);shareUrl=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=shareUrl;a.download=`你俩的出厂设置-${shareKind==='pair'?'双人封面':'我的封面'}.png`;a.click();
      toast('PNG 已生成，请在浏览器下载中查看。');
    } catch {document.querySelector('#share-error').textContent='图片暂未生成成功，请重试；也可以保留当前结果稍后再来。';}
    finally {button.disabled=false;button.textContent='下载 PNG ↓';}
  }
  function jump(i) { closeDialog();state.cursor=Math.max(0,Math.min(23,i));go('survey'); }
  function cancelAutoAdvance() {
    clearTimeout(autoAdvanceTimer);autoAdvanceTimer=null;autoAdvanceToken++;
    document.querySelectorAll('input[name=answer]').forEach(input=>input.disabled=false);
    const status=document.querySelector('#auto-answer-status');
    if(status)status.textContent='选好即进入下一题，可返回修改。';
  }
  function advanceAnsweredQuestion() {
    const p=state.people[state.active];
    if(!Object.hasOwn(p.answers,questions[state.cursor].id))return;
    if(state.cursor<23){state.cursor++;go('survey');return;}
    const missing=questions.findIndex(q=>!Object.hasOwn(p.answers,q.id));
    if(missing>=0){state.cursor=missing;go('survey');document.querySelector('#answer-error').textContent='还有未答题，已回到第一道。无法判断时，可以选“不适用 / 不愿回答”。';}
    else go('result');
  }
  function answerChanged(value) {
    if(state.screen!=='survey'||modal.open||autoAdvanceTimer!==null)return;
    if(value!=='NA'&&!(Number.isInteger(value)&&value>=1&&value<=5))return;
    const p=state.people[state.active],q=questions[state.cursor];
    if(p.answers[q.id]!==value){p.answers[q.id]=value;p.consent=false;save();}
    document.querySelector('#answer-error').textContent='';
    document.querySelector('#answered-count').textContent=count(p);
    const progress=document.querySelector('[role=progressbar]');progress.setAttribute('aria-valuenow',count(p));progress.firstElementChild.style.width=count(p)/24*100+'%';
    document.querySelector('#auto-answer-status').textContent=state.cursor===23?'已选好，正在整理结果…':'已选好，进入下一题…';
    document.querySelectorAll('input[name=answer]').forEach(input=>input.disabled=true);
    const token=++autoAdvanceToken,active=state.active,cursor=state.cursor;
    autoAdvanceTimer=setTimeout(()=>{
      if(token!==autoAdvanceToken||state.screen!=='survey'||state.active!==active||state.cursor!==cursor||modal.open)return;
      autoAdvanceTimer=null;
      advanceAnsweredQuestion();
    },220);
  }
  // A re-click on an already checked answer also continues after going back.
  document.addEventListener('click',e=>{
    if(!e.target.matches('input[name=answer]'))return;
    if(e.detail>1){e.preventDefault();e.stopImmediatePropagation();return;}
    answerChanged(e.target.value==='NA'?'NA':Number(e.target.value));
  },true);
  document.addEventListener('keydown',e=>{
    if(e.repeat&&e.target.matches('input[name=answer]'))e.preventDefault();
  });
  window.addEventListener('pagehide',cancelAutoAdvance);
  document.addEventListener('input',e=>{
    if(e.target.id==='nickname'){state.people[state.screen==='handoff'?'b':'a'].alias=cleanName(e.target.value);save();}
    if(e.target.id==='weekly-agreement'){state.agreement=cleanLine(e.target.value,160);save();}
    if(e.target.id==='personal-note'){state.people[state.active].manual=cleanLine(e.target.value);save();}
    if(e.target.id==='share-copy'){if(shareKind==='pair'){state.pairCopy=cleanLine(e.target.value);document.querySelector('#share-consent-a').checked=false;document.querySelector('#share-consent-b').checked=false;}else state.people[state.active].manual=cleanLine(e.target.value);save();drawShare();}
  });
  document.addEventListener('change',e=>{
    if(e.target.matches('input[name=mode]')){state.mode=e.target.value==='pair'?'pair':'single';save();document.querySelector('#mode-hint').textContent=state.mode==='pair'?'你先答完，再把这台设备交给对方。':'先读懂自己的需要，也可以只保留个人结果。';}
    if(e.target.matches('input[name=answer]'))answerChanged(e.target.value==='NA'?'NA':Number(e.target.value));
    if(e.target.id==='include-name'){
      if(shareKind==='pair'){document.querySelector('#share-consent-a').checked=false;document.querySelector('#share-consent-b').checked=false;}
      drawShare();
    }
  });
  document.addEventListener('click',e=>{
    const brand=e.target.closest('.brand');if(brand){e.preventDefault();go('home');return;}
    const el=e.target.closest('[data-action]');if(!el||el.disabled)return;
    const action=el.dataset.action;
    if(action==='preview-cover')previewCover(Number(el.dataset.cover));
    else if(action==='browse-covers')document.querySelector('#covers')?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});
    else if(action==='cycle-cover'){const y=scrollY;state.featuredRole=(state.featuredRole+Number(el.dataset.step)+12)%12;save();render();window.scrollTo(0,y);}
    else if(action==='pick-a-cover')chooseRoles('a');
    else if(action==='pick-b-cover')chooseRoles('b');
    else if(action==='legacy')legacyOptions();
    else if(action==='export-legacy')exportLegacy();
    else if(action==='delete-legacy-confirm')openDialog('单独删除 48 题旧记录？','<p class="dialog-copy">只删除原版记录，不影响新版 24 题。建议先导出存档，删除后网页无法恢复。</p>','<button class="button outline small" data-action="close">保留旧记录</button><button class="button danger small" data-action="delete-legacy">确认删除旧记录</button>');
    else if(action==='delete-legacy'){try{localStorage.removeItem(OLD_KEY);legacyRecord=null;closeDialog();render();toast('48题旧记录已按你的确认单独删除。');}catch{toast('未能删除旧记录，请检查浏览器设置。');}}
    else if(action==='home')go('home');
    else if(action==='covers')go('covers');
    else if(action==='confirm-cover'){state.people.a.role=state.featuredRole;go('setup');}
    else if(action==='skip-cover'){state.people.a.role=null;go('setup');}
    else if(action==='start'){if(modal.open)closeDialog();start(el.dataset.mode,false,Number(el.dataset.cover??state.featuredRole));}
    else if(action==='new-confirm'){const mode=el.dataset.mode,cover=Number(el.dataset.cover??state.featuredRole);closeDialog();start(mode,true,cover);}
    else if(action==='resume')go(complete(state.people[state.active])?'result':count(state.people[state.active])?'survey':state.active==='b'?'handoff':'setup');
    else if(action==='method')go('method');
    else if(action==='privacy')privacy();
    else if(action==='close')closeDialog();
    else if(action==='clear-confirm')openDialog('确定清除本版 24 题数据？','<p class="dialog-copy">本版两位的答案、昵称、封面、约定、进度与对照同意将被清除。48 题旧记录原样保留。已经下载的 PNG 不会被删除。</p>','<button class="button outline small" data-action="close">保留数据</button><button class="button danger small" data-action="clear">确认清除</button>');
    else if(action==='clear') {try{localStorage.removeItem(KEY);}catch{}state=fresh();closeDialog();go('home',true);try{localStorage.removeItem(KEY);}catch{}toast('本版 24 题数据已清除，48 题旧记录未改动。');}
    else if(action==='begin'||action==='begin-b') {
      if(!document.querySelector('#start-consent').checked){document.querySelector('#setup-error').textContent='请先由作答本人确认自愿参与；不愿意时可以返回首页。';document.querySelector('#start-consent').focus();return;}
      state.active=action==='begin-b'?'b':'a';state.people[state.active].alias=cleanName(document.querySelector('#nickname').value);
      state.cursor=questions.findIndex(q=>!Object.hasOwn(state.people[state.active].answers,q.id));if(state.cursor<0)state.cursor=0;go('survey');
    }
    else if(action==='previous'){if(state.cursor>0){state.cursor--;go('survey');}}
    else if(action==='review')review();
    else if(action==='jump')jump(Number(el.dataset.index));
    else if(action==='edit-facet'){state.cursor=questions.findIndex(q=>q.id===facets[Number(el.dataset.facet)].questions[0].id);go('survey');}
    else if(action==='return-result'){closeDialog();go('result');}
    else if(action==='roles')chooseRoles();
    else if(action==='choose-role'){state.people[rolePickerTarget??state.active].role=Number(el.dataset.role);save();closeDialog();render();main.querySelector('[data-action=roles],[data-action=pick-a-cover],[data-action=pick-b-cover]')?.focus();toast('封面已更新，12 项结果保持原样。');}
    else if(action==='no-role'){state.people[rolePickerTarget??state.active].role=null;save();closeDialog();render();main.querySelector('[data-action=roles],[data-action=pick-a-cover],[data-action=pick-b-cover]')?.focus();toast('已保留不贴标签的封面。');}
    else if(action==='share')sharing();
    else if(action==='share-pair'){if(state.people.a.consent&&state.people.b.consent)sharing('pair');}
    else if(action==='download')download();
    else if(action==='pair-next') {
      if(!document.querySelector('#compare-consent').checked){document.querySelector('#compare-error').textContent='请由本人确认是否愿意互看结果；也可以选择保留个人结果。';return;}
      state.people[state.active].consent=true;save();
      if(state.active==='a'&&!complete(state.people.b)){state.active='b';state.cursor=0;go('handoff');}
      else if(state.people.a.consent&&state.people.b.consent)go('compare');
      else openDialog('还需要另一位本人同意','<p class="dialog-copy">另一位尚未同意，或修改过答案。请交给另一位查看自己的结果，再由本人决定。不会跳过同意直接显示对照。</p>',`<button class="button outline small" data-action="close">先保留个人结果</button><button class="button small" data-action="own-result" data-person="${state.active==='a'?'b':'a'}">交给另一位查看自己的结果</button>`);
    }
    else if(action==='personal-only'){state.people[state.active].consent=false;document.querySelector('#compare-consent').checked=false;save();toast('已保留个人结果，不进入对照。');}
    else if(action==='cancel-pair'){state.people.a.consent=false;state.people.b.consent=false;state.active='a';go('result');}
    else if(action==='own-result'){if(modal.open)closeDialog();state.active=el.dataset.person;go('result');}
    else if(action==='revoke')openDialog('任何一位都可以暂停对照','<p class="dialog-copy">撤回后回到所选的个人报告，不再展示双人对照。之后若想重新对照，仍需要双方分别同意。</p>','<button class="button outline small" data-action="close">暂时保留</button><button class="button small" data-action="revoke-person" data-person="a">A 撤回</button><button class="button small" data-action="revoke-person" data-person="b">B 撤回</button>');
    else if(action==='revoke-person'){state.people[el.dataset.person].consent=false;state.active=el.dataset.person;closeDialog();go('result');toast('已撤回对照同意，双方答案仍各自保留。');}
    else if(action==='example'){example=true;main.innerHTML=renderCompare();headingFocus();window.scrollTo(0,0);main.querySelector('h1').focus();}
  });
  modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog();}});
  modal.addEventListener('cancel',e=>{e.preventDefault();closeDialog();});
  window.addEventListener('popstate',e=>{
    cancelAutoAdvance();
    if(modal.open)closeDialog();example=false;
    if(e.state){const secondInProgress=state.mode==='pair'&&state.active==='b'&&!complete(state.people.b);state.active=secondInProgress?'b':e.state.active==='b'&&state.mode==='pair'?'b':'a';state.screen=safeScreen(e.state.screen||'home');state.cursor=Number.isInteger(e.state.cursor)?Math.max(0,Math.min(23,e.state.cursor)):0;}else state.screen='home';
    save();render();window.scrollTo(0,0);
  });
  // Pure scoring functions are also used by the reproducible local QA script.
  window.FactorySettings=Object.freeze({score,recommended,pairModel,soloModel,questions,facets,version:C.version});
  state.screen=safeScreen(state.screen);history.replaceState({screen:state.screen,active:state.active,cursor:state.cursor},'','#'+state.screen);render();
  if(loadNotice)toast(loadNotice);
})();

</script>
</body>
</html>
